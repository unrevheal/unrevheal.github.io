<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music | UNREVHEAL</title>
    <style>
        /* CSS Base */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg-color: #0a0a0a; --text-color: #eeeeee; --accent-color: #ff4500; --card-bg: #141414; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Arial Narrow', Arial, sans-serif; letter-spacing: 1px; line-height: 1.6; }
        h1, h2, h3 { text-transform: uppercase; color: #fff; }
        p, li { font-family: 'Arial', sans-serif; color: #b3b3b3; }
        a { color: var(--accent-color); text-decoration: none; transition: 0.3s; }
        a:hover { color: #fff; }
        header { background-color: rgba(10, 10, 10, 0.95); position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 2px solid var(--accent-color); }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 20px; }
        /* Stili per il Logo a Immagine */
        .logo {
            display: flex;
            align-items: center;
            max-height: 50px;
        }

        .logo a {
            display: flex;
            align-items: center;
        }

        .logo-img {
            height: 45px !important;
            width: auto !important;
            max-width: 200px;
            object-fit: contain;
            display: block;
            transition: transform 0.2s ease;
        }

        .logo-img:hover {
            transform: scale(1.05);
        }
        nav ul { display: flex; list-style: none; }
        nav ul li { margin-left: 20px; }
        nav ul li a { font-size: 1.1rem; text-transform: uppercase; }
        nav ul li a.active { color: #fff; border-bottom: 2px solid var(--accent-color); }
        section { padding: 140px 20px 60px 20px; max-width: 1200px; margin: 0 auto; min-height: 80vh; }
        .section-title { font-size: 2.5rem; margin-bottom: 40px; border-left: 5px solid var(--accent-color); padding-left: 15px; }
        footer { text-align: center; padding: 40px; color: #555; font-size: 0.8rem; font-family: sans-serif; }
        
        /* LAYOUT SEZIONE MUSICA */
        .subsection-title {
            font-size: 1.8rem;
            margin: 30px 0 20px 0;
            color: #fff;
            text-transform: uppercase;
            border-bottom: 2px solid var(--accent-color);
            display: inline-block;
            padding-bottom: 5px;
        }

        /* Bandcamp: 3 colonne uniformi al 100% della larghezza */
        .music-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            width: 100%;
            margin-bottom: 50px;
        }

        /* Spotify: 2 colonne uniformi al 100% della larghezza */
        .spotify-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            width: 100%;
        }

        /* Card contenitore per tutti i player */
        .player-card {
            background-color: var(--card-bg);
            border: 1px solid #222;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
            width: 100%;
        }

        .player-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        /* Responsive per tablet e smartphone */
        @media (max-width: 900px) {
            .music-grid, .spotify-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 768px) { 
            .nav-container { flex-direction: column; } 
            nav ul { margin-top: 15px; } 
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo">
    <a href="index.html">
        <img src="logo.png" alt="UNREVHEAL Logo" class="logo-img">
    </a>
</div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="tour.html">Tour</a></li>
                    <li><a href="musica.html" class="active">Music</a></li>
                    <li><a href="contatti.html">Contacts</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section>

        <!-- Sezione Bandcamp -->
        <h3 class="subsection-title">Listen on Bandcamp</h3>
        <div class="music-grid">
            <div class="player-card">
                <iframe style="border: 0; width: 100%; height: 350px;" src="https://bandcamp.com/EmbeddedPlayer/track=2605178560/size=large/bgcol=333333/linkcol=ff4500/minimal=true/transparent=true/" seamless>
                    <a href="https://unrevheal.bandcamp.com/track/glacier">Glacier by Unrevheal</a>
                </iframe>
            </div>
            <div class="player-card">
                <iframe style="border: 0; width: 100%; height: 350px;" src="https://bandcamp.com/EmbeddedPlayer/album=1575280889/size=large/bgcol=333333/linkcol=ff4500/minimal=true/transparent=true/" seamless>
                    <a href="https://unrevheal.bandcamp.com/album/whats-left-of-us">What&#39;s Left of Us by Unrevheal</a>
                </iframe>
            </div>
            <div class="player-card">
                <iframe style="border: 0; width: 100%; height: 350px;" src="https://bandcamp.com/EmbeddedPlayer/album=3781586356/size=large/bgcol=333333/linkcol=ff4500/minimal=true/transparent=true/" seamless>
                    <a href="https://unrevheal.bandcamp.com/album/regrets-single">Regrets - Single by Unrevheal</a>
                </iframe>

        </div>

        <!-- Sezione Spotify -->
        <h3 class="subsection-title">Listen on Spotify</h3>

            <div class="player-card">
                <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/album/1a5rWnWZxHVEe8K5KI4idj?utm_source=generator&theme=0&si=321cb81dfa884978" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

    </section>

    <footer>&copy; 2026 UNREVHEAL.</footer>
</body>
</html>
